<!doctype html>
<!-- rogs-skills chat-paste: a message rendered locally for Slack or Teams -->
<html lang="en" data-message-revision="{{REVISION}}" data-message-digest="{{DIGEST}}" data-destination="{{DESTINATION}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>{{TITLE}} | Chat paste</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23202124%27/%3E%3Ctext x=%278%27 y=%2712.5%27 font-family=%27monospace%27 font-size=%2712%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%2350fa7b%27%3E%3E%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/viewer.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-title"><span class="prompt">~/</span><strong>{{TITLE}}</strong><span class="chip">rev {{REVISION}}</span></div>
    <div class="topbar-actions">
      <span id="cp-hint" class="hint" role="status"></span>
      <button type="button" id="cp-comment" aria-pressed="false" aria-keyshortcuts="c" disabled>Comment<span class="count" hidden></span></button>
      <button type="button" id="cp-changes" aria-pressed="true" hidden>Changes</button>
      <button type="button" id="cp-notify" aria-label="Notify me of new revisions" title="Notify me of new revisions" hidden></button>
      <button type="button" id="cp-theme" aria-label="Switch between light and dark mode"></button>
      <button type="button" id="cp-done" class="primary" disabled>Done</button>
    </div>
  </header>
  <div id="cp-banner" role="status" hidden></div>
  <main class="layout">
    <div class="toolbar">
      <button type="button" class="primary" id="copy-slack" disabled>Copy for Slack</button>
      <button type="button" class="primary" id="copy-teams" disabled>Copy for Teams</button>
      <button type="button" id="copy-plain" disabled>Copy plain text</button>
    </div>
    <p id="status" role="status" aria-live="polite">Preparing the copy buttons...</p>
    <p id="warning" role="alert">{{WARNINGS}}</p>
    <article aria-label="Formatted message">{{CONTENT}}</article>
  </main>
  <div id="toast" aria-hidden="true"></div>
  <noscript>The copy buttons need JavaScript. The message has not been copied.</noscript>
  <script type="application/json" id="chat-paste-data">{{DATA}}</script>
  <script defer src="/assets/copy.js"></script>
  <script defer src="/assets/attention.js"></script>
  <script defer src="/assets/changes.js"></script>
  <script defer src="/assets/viewer.js"></script>
</body>
</html>
