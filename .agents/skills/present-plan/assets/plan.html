<!doctype html>
<!-- rogs-skills present-plan: canonical Markdown, rendered locally -->
<html lang="en" data-plan-revision="{{REVISION}}" data-plan-digest="{{DIGEST}}" data-session-kind="{{KIND}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>{{TITLE}} | Plan review</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23202124%27/%3E%3Ctext x=%278%27 y=%2712.5%27 font-family=%27monospace%27 font-size=%2712%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%2350fa7b%27%3E%23%3C/text%3E%3C/svg%3E">
  {{FONTS}}
  <link rel="stylesheet" href="/assets/viewer.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-title"><span class="prompt">~/</span><strong>{{TITLE}}</strong><span class="chip">rev {{REVISION}}</span></div>
    <div class="topbar-actions">
      <span id="pp-hint" class="hint" role="status"></span>
      <button type="button" id="pp-comment" aria-pressed="false" aria-keyshortcuts="c" disabled>Comment<span class="count" hidden></span></button>
      <button type="button" id="pp-changes" aria-pressed="true" hidden>Changes</button>
      <button type="button" id="pp-notify" aria-label="Notify me of new revisions" title="Notify me of new revisions" hidden></button>
      <button type="button" id="pp-theme" aria-label="Switch between light and dark mode"></button>
      <button type="button" id="pp-approve" class="primary" disabled>Approve</button>
    </div>
  </header>
  <div id="pp-banner" role="status" hidden></div>
  <div class="layout">
    <nav aria-label="Plan sections">{{TOC}}</nav>
    <article>
      <p class="eyebrow">Plan review | {{TICKET}} | Revision {{REVISION}}</p>
      <details class="source-details"><summary>Canonical source and revision</summary><p><a href="source">Read the exact Markdown source</a></p><p>SHA-256: <code>{{DIGEST}}</code></p><p>{{LOCATION}}</p></details>
      {{CONTENT}}
    </article>
  </div>
  {{SCRIPTS}}
</body>
</html>
